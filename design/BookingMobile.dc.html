<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BookPage booking page on mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:#EBEBE8}</style>
</helmet>
<div style="width:390px;height:1700px;overflow:hidden;background:#EBEBE8"><dc-import name="BookingPage" biz="{{biz}}" hint-size="390px,1700px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"biz":{"editor":"select","default":"salon","options":["salon","barber","clinic","tutor"]},"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic { renderVals() { return { biz: this.props.biz ?? 'salon' }; } }
</script>
</body>
</html>
