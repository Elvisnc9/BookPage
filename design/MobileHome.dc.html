<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BookPage mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#EBEBE8}
a{color:#0D0D10}a:hover{color:#0D0D10}
::selection{background:#0D0D10;color:#FFFFFF}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #0D0D10;outline-offset:2px}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.lab{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.08em;color:#5C5C66}
.scan{font-family:'Geist Mono',ui-monospace,monospace;font-weight:600;letter-spacing:-0.06em;color:transparent;background-image:repeating-linear-gradient(180deg,var(--ink,#0D0D10) 0 5px,transparent 5px 9px);background-size:100% 18px;-webkit-background-clip:text;background-clip:text;animation:scan 3.4s linear infinite;padding-bottom:.06em}
@keyframes scan{to{background-position:0 -18px}}
.box{border:2px solid #0D0D10;border-radius:8px;background:#FFFFFF}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.06em;text-decoration:none;border-radius:6px;border:2px solid #0D0D10;white-space:nowrap;transition:transform 140ms cubic-bezier(.23,1,.32,1),background-color 180ms ease,color 180ms ease,box-shadow 180ms ease}
.btn:active{transform:scale(.97)}
.bp{background:#0D0D10;color:#FFFFFF;border-color:#0D0D10}.bk{background:#0D0D10;color:#FFFFFF}.bo{background:#FFFFFF;color:#0D0D10}
.chip{height:32px;padding:0 12px;border-radius:6px;border:1px solid #CFCFD4;background:#FFFFFF;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.06em;transition:background-color 160ms ease,color 160ms ease,border-color 160ms ease}
.chip[aria-pressed="true"]{background:#0D0D10;color:#FFFFFF;border-color:#0D0D10}
.lift{transition:transform 220ms cubic-bezier(.23,1,.32,1),box-shadow 220ms ease}
@media (hover:hover) and (pointer:fine){.bp:hover{background:#2A2A30;color:#FFFFFF}.bo:hover{background:#0D0D10;color:#FFFFFF}.bk:hover{background:#2A2A30;color:#FFFFFF}.lift:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 #0D0D10}.nv:hover{background:#EBEBE8}.chip:hover{border-color:#0D0D10}.row:hover{background:#FAFAF9}}
.tw{position:absolute;width:16px;transform-style:preserve-3d;animation:wave 5.2s cubic-bezier(.45,0,.55,1) infinite}
.tile{position:absolute;left:0;right:0;top:0;border-radius:5px;background:linear-gradient(180deg,hsl(var(--h) 22% 76%) 0%,hsl(var(--h) 20% 56%) 55%,hsl(calc(var(--h) - 10) 18% 38%) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -14px 24px rgba(0,0,0,.22);animation:flip var(--spd,7s) linear infinite}
@keyframes flip{from{transform:rotateX(0deg) rotateY(-28deg)}to{transform:rotateX(360deg) rotateY(-28deg)}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.fast .tile{--spd:2.2s}
.px2{position:absolute;background:#B5B5BC;animation:tw 6s steps(3) infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.9}}
.blink{animation:bl 1.1s steps(2,start) infinite}
@keyframes bl{to{visibility:hidden}}
.tick{animation:tk 380ms cubic-bezier(.23,1,.32,1)}
@keyframes tk{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.ans{animation:tk 280ms cubic-bezier(.23,1,.32,1)}
.pop{animation:pop 420ms cubic-bezier(.23,1,.32,1)}
@keyframes pop{0%{transform:scale(.85) translateY(8px);opacity:0}100%{transform:none;opacity:1}}
.flt{animation:fl 7s cubic-bezier(.45,0,.55,1) infinite}.flt2{animation:fl 8.5s cubic-bezier(.45,0,.55,1) -3s infinite}
@keyframes fl{0%,100%{translate:0 0}50%{translate:0 -8px}}
.run{animation:runp 1s linear infinite}
@keyframes runp{0%,100%{box-shadow:0 0 0 0 rgba(224,122,63,.5)}60%{box-shadow:0 0 0 7px rgba(224,122,63,0)}}
.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.typing i{display:inline-block;width:6px;height:6px;border-radius:999px;background:#0D0D10;margin-right:3px;animation:tp 1s cubic-bezier(.77,0,.175,1) infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.06em;text-decoration:none;color:#5C5C66}
.tab[aria-current="page"]{color:#0D0D10;font-weight:600}
textarea{width:100%;min-height:88px;padding:10px 12px;border:1px solid #0D0D10;border-radius:6px;font-size:15px;line-height:1.5;box-sizing:border-box;outline:0;background:#FFFFFF;resize:none}
@media (prefers-reduced-motion:reduce){.scan,.tw,.tile,.px2,.blink,.tick,.ans,.pop,.flt,.flt2,.run,.spin,.typing i{animation:none}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;font-family:Geist,'Helvetica Neue',sans-serif;color:#0D0D10;background:#EBEBE8;display:flex;flex-direction:column;overflow:hidden"><header style="display:flex;align-items:center;gap:10px;padding:18px 18px 10px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="2" fill="#0D0D10"></rect><rect x="13" y="13" width="9" height="9" rx="2" fill="#0D0D10"></rect><rect x="13" y="2" width="9" height="9" rx="2" fill="none" stroke="#0D0D10" stroke-width="1.6"></rect></svg><span class="mono" style="font-weight:600;font-size:13px;letter-spacing:.08em;flex:1">GLOW STUDIO</span><span class="mono" style="display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.06em"><i class="blink" style="width:6px;height:6px;border-radius:999px;background:#1F9D63"></i>PAGE LIVE</span></header><main style="flex:1;overflow:hidden;padding:4px 18px 0;display:flex;flex-direction:column;gap:14px">
<h1 style="margin:0;font-weight:700;font-size:40px;letter-spacing:-0.05em;line-height:.95">{{n}} bookings <span class="scan">today</span></h1>
<div class="box" style="padding:16px;display:flex;flex-direction:column;gap:8px;background:#0D0D10;color:#FFFFFF;border-color:#0D0D10;box-shadow:5px 5px 0 #0D0D10"><span class="mono" style="font-size:10px;letter-spacing:.08em">NEXT UP · IN {{mins}} MIN</span><span style="font-weight:700;font-size:22px;letter-spacing:-0.02em">Tola Martins · 11:30AM</span><span class="mono" style="font-size:11px">SILK PRESS · ₦18,000 · CONFIRMED BY REMINDER</span></div>
<sc-if value="{{qOpen}}" hint-placeholder-val="{{true}}"><a href="MobileHandoff.dc.html" class="box" style="display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;box-shadow:5px 5px 0 #0D0D10"><span class="mono" style="font-size:24px;font-weight:600">2</span><span style="display:flex;flex-direction:column;line-height:1.3;flex:1"><span style="font-weight:700">Questions for you</span><span class="mono" style="font-size:10px;color:#5C5C66">ANSWER ONCE, THE AI REMEMBERS</span></span><span class="mono">→</span></a></sc-if>
<span class="lab">SCHEDULE</span>
<div style="display:flex;flex-direction:column;gap:8px"><sc-for list="{{sched}}" as="b" hint-placeholder-count="5"><div class="box" style="{{b.st}}"><span class="mono" style="font-size:12px;font-weight:600;width:62px;flex:none">{{b.t}}</span><span style="display:flex;flex-direction:column;line-height:1.3;flex:1;min-width:0"><span style="font-weight:600;font-size:15px">{{b.n}}</span><span class="mono" style="font-size:10px;color:#5C5C66">{{b.s}}</span></span><button onClick="{{b.go}}" class="btn bo" style="height:34px;font-size:10px;padding:0 10px">{{b.act}}</button></div></sc-for></div>
</main><nav aria-label="Main" style="display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px 26px;background:#FFFFFF;border-top:1px solid #0D0D10"><a class="tab" href="MobileHome.dc.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 3l9 7v11H3z"></path></svg>TODAY</a><a class="tab" href="Overview.dc.html" aria-current="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3.5v4M16 3.5v4"></path></svg>BOOKINGS</a><a class="tab" href="MobileHandoff.dc.html" aria-current="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-4.5 3.5V16H4z"></path></svg>QUESTIONS</a><a class="tab" href="BookingMobile.dc.html" aria-current="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18"></path></svg>MY PAGE</a></nav></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0, arr: { 'Bisi Adewale': true } }; }
  componentDidMount() { this.t = setInterval(() => this.setState({ i: this.state.i + 1 }), 1600); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const st = this.state;
    const S = [ ['9:00AM', 'Bisi Adewale', 'KNOTLESS BRAIDS'], ['11:30AM', 'Tola Martins', 'SILK PRESS'], ['1:00PM', 'Amaka Obi', 'LASH EXTENSIONS'], ['3:00PM', 'Zainab Bello', 'GEL NAILS · NO REPLY YET'], ['5:30PM', 'Funmi Ade', 'WASH AND SET'] ];
    const sched = S.map(([t, n, s]) => { const a = !!st.arr[n]; return { t, n, s, act: a ? 'ARRIVED ✓' : 'ARRIVED?', go: () => this.setState({ arr: { ...st.arr, [n]: !a } }), st: 'display:flex;align-items:center;gap:10px;padding:12px 14px;' + (a ? 'opacity:.55' : '') }; });
    return { n: S.length, mins: Math.max(1, 34 - Math.floor(st.i / 4)), sched, qOpen: true };
  }
}
</script>
</body>
</html>
