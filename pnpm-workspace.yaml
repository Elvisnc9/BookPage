packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - workerd

# @astrojs/check falls back to WASM bindings that need these peers present.
packageExtensions:
  '@napi-rs/wasm-runtime':
    dependencies:
      '@emnapi/core': '^1.5.0'
      '@emnapi/runtime': '^1.5.0'
